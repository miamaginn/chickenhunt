<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Binge</title>
  <meta name="description" content="Log, rank and compare TV shows with your friends, season by season." />
  <meta name="theme-color" content="#14111f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Binge" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="signed-out">
  <header class="topbar">
    <a class="brand" href="#/feed"><span class="brand-mark" aria-hidden="true">▶</span>Binge</a>
    <a id="meBtn" class="me-btn" href="#/me" aria-label="Your profile"></a>
  </header>
  <div id="demoRibbon" class="demo-ribbon" hidden>🧪 Demo mode · saved on this device only</div>

  <main id="main"><p class="muted center" style="padding:40px">Loading…</p></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/feed" data-tab="feed"><span aria-hidden="true">🏠</span>Feed</a>
    <a href="#/discover" data-tab="discover"><span aria-hidden="true">🔍</span>Discover</a>
    <a href="#/rank" data-tab="rank"><span aria-hidden="true">🏆</span>My shows</a>
    <a href="#/friends" data-tab="friends"><span aria-hidden="true">👯</span>Friends<b id="friendBadge" class="badge" hidden></b></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
